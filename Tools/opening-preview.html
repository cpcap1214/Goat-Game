<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GTA7 · 前導劇情預覽</title><style>body{margin:0;background:#0b0b20;color:#fff2d4;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(100%,1100px)}canvas{width:100%;aspect-ratio:16/9;display:block;image-rendering:pixelated}nav{display:flex;gap:15px;align-items:center;padding:18px}button{background:#ebbf6e;color:#14172a;border:0;padding:10px 24px;border-radius:4px;font:inherit;cursor:pointer}input{flex:1}small{display:block;color:#a7a7bc;padding:0 18px 18px}</style><main><canvas width="960" height="540"></canvas><nav><button id="play">播放</button><button id="restart">重播</button><input id="seek" aria-label="播放進度" type="range" min="0" max="27" step=".01" value="0"><span id="time">0 / 27 秒</span></nav><small>前導劇情畫面預覽 · Unity 版另待編譯驗證。此預覽結束後停在最後一幕。</small></main><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),seek=document.querySelector('#seek'),play=document.querySelector('#play');let t=0,running=false,last=0;
const prize=new Image(),atlas=new Image();prize.src='__PRIZE__';atlas.src='__GOAT__';const frames=__FRAMES__;
const cream='#fff2d4',gold='#ebbf6e',cyan='#59f5ff',night='#0e0e26';
function box(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function text(s,x,y,size=24,col=cream){g.fillStyle=col;g.font=`bold ${size}px system-ui`;g.textAlign='center';g.fillText(s,x,y)}
function goat(x,y,size,walk=false,phase=0){let f=frames[(walk?6:0)+(Math.floor(t*(walk?12:6)+phase)%6)],p=f.pivot;g.drawImage(atlas,f.x,atlas.height-f.y-256,256,256,x-p.x*size,y-(1-p.y)*size,size,size)}
function camera(x,y,s=1,col=cyan){box(x-23*s,y-15*s,46*s,30*s,night);box(x-17*s,y-20*s,17*s,7*s,gold);box(x-10*s,y-10*s,20*s,20*s,col);box(x-6*s,y-6*s,12*s,12*s,night);box(x+14*s,y-10*s,5*s,5*s,cream)}
function board(x,y,h,a){let face=Math.cos(a),w=h*2/3*Math.abs(face);box(x-w/2-5,y-h/2-5,w+10,h+10,gold);box(x-w/2,y-h/2,w,h,'#59308f');if(face>0)g.drawImage(prize,x-w/2,y-h/2,w,h);else if(w>55)text('GTA7',x,y+12,Math.min(40,w/3),gold)}
const land=document.createElement('canvas');land.width=240;land.height=135;const lg=land.getContext('2d');for(let y=0;y<135;y++)for(let x=0;x<240;x++){let q=y/135,col=`rgb(${(214-183*q)|0},${(148-105*q)|0},${(150-56*q)|0})`,far=55+25*Math.sin(x*.025)+12*Math.sin(x*.067),peak=110-Math.abs(x-163)*.79;if(y<far)col='#4f527d';if(y<peak)col=x<163?'#3d4063':'#293052';if(y<peak&&y>94+Math.sin(x*.3)*3)col='#d9dbe3';if(y<24+9*Math.sin(x*.034))col='#1a303d';lg.fillStyle=col;lg.fillRect(x,134-y,1,1)}
function draw(){g.imageSmoothingEnabled=false;box(0,0,960,540,night);let shot=t<7?0:t<13?1:t<20?2:3;
if(shot<2){for(let i=0;i<12;i++)box(i*80,0,40,420,'#261a42');box(100,96,760,300,'#59308f');box(100,96,760,4,gold);text('山羊世界攝影大賽',480,65,32);for(let i=0;i<30;i++)box(80+(i*71+t*12)%800,100+(i*47+t*22)%270,4,7,i%2?cyan:gold);box(60,365,840,52,'#40264f');if(shot===0){board(480,238,220,Math.sin(t*.5)*.35);text('冠軍獎品  /  GTA7',480,130,20,gold);for(let i=0;i<11;i++){let x=42+i*87+Math.sin(t+i)*5,y=422+Math.sin(t*3+i)*4;goat(x,y,95,false,i*2);camera(x+15,y-30,.38,cream)}}else{board(480,254,284,(t-7)*1.4);text('拍下世界上',215,210,27);text('最美的風景',215,250,27);text('贏得',755,216,34,gold);text('GTA7',755,260,34,gold);goat(810,414,138);camera(835,365,.6,cream)}}else{g.drawImage(land,0,0,960,540);for(let i=0;i<7;i++)box(((i*167-t*5)%1100+1100)%1100-140,80+i%3*35,100,8,'#dbccd933');if(shot===2){let u=(t-13)/7,x=145+400*u,y=410;box(0,409,960,34,'#263b40');goat(x,y,154,true);camera(x+27,y-47,.65,cream);text('傳說中最難攀登的山',705,75,23)}else{box(0,0,960,540,'#12082e61');goat(350,414,226);camera(450,295,2);for(let i=0;i<20;i++){let a=t*1.1+i*Math.PI/10,rad=50+((i*17-t*25)%125+125)%125;box(450+Math.cos(a)*rad,295+Math.sin(a)*rad*.65,5,5,'#80ffffb3')}g.globalAlpha=Math.max(0,Math.min(1,(t-22)/2))*.4;goat(650,390,180);g.globalAlpha=1}}
const caption=t<7?'熱愛攝影的山羊們，齊聚一年一度的攝影大賽。':t<13?'只要拍下最美的風景，就能贏得冠軍獎品《GTA7》！':t<20?'為了冠軍，小山羊決定挑戰傳說中最難攀登的山。':t<23.5?'沒想到，這是一座魔法山。相機也悄悄發生了變化……':'當照片與軌跡化為現實，登頂的冒險就此開始。';box(0,445,960,95,'#060814');text(caption,480,492,23);box(55,526,850*t/27,2,gold);let local=t-[0,7,13,20][shot],fade=Math.max(0,1-local/.45,Math.min(1,(t-26.3)/.7));if(fade>0){g.globalAlpha=fade;box(0,0,960,540,'#060814');g.globalAlpha=1}seek.value=t;document.querySelector('#time').textContent=t.toFixed(1)+' / 27 秒';}
function loop(now){if(running){t=Math.min(27,t+(now-last)/1000);if(t>=27){running=false;play.textContent='播放'}}last=now;draw();requestAnimationFrame(loop)}
play.onclick=()=>{if(t>=27)t=0;running=!running;play.textContent=running?'暫停':'播放'};document.querySelector('#restart').onclick=()=>{t=0;running=true;play.textContent='暫停'};seek.oninput=()=>{t=+seek.value;draw()};Promise.all([prize.decode(),atlas.decode()]).then(()=>requestAnimationFrame(loop)).catch(()=>text('素材載入失敗',480,270));
</script></html>
